<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifica tu cuenta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            color: #333333;
        }

        p {
            color: #555555;
            line-height: 1.6;
        }

        .code-box {
            display: inline-block;
            margin: 20px auto;
            padding: 15px 30px;
            background-color: #f0f0f5;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #222;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verifica tu cuenta</h1>
        <p>Tu código de verificación es:</p>
        <div class="code-box">{{VERIFICATION_CODE}}</div>
        <p>Introduce este código en la aplicación para completar el proceso.</p>
        <p>Si no has solicitado este código, puedes ignorar este mensaje.</p>
        <div class="footer"></div>
    </div>
</body>
</html>
